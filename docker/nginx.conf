# SSE requires buffering disabled; map Upgrade so WebSocket upgrades pass through.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Match the API's 256 kb JSON body cap.
    client_max_body_size 256k;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (not append) so clients cannot spoof their address to the rate limiters.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Live event streams (SSE) must never be buffered or cached.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
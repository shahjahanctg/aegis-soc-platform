name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-build:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Build (frontend + server bundle)
        run: npm run build

  e2e:
    name: Full-stack E2E (Postgres + Redis + app + nginx)
    runs-on: ubuntu-latest
    needs: typecheck-build
    steps:
      - uses: actions/checkout@v4

      - name: Boot the stack
        run: docker compose up -d --build
        env:
          INGEST_API_KEY: ci-ingest-key
          ADMIN_PASSWORD: ci-admin-password

      - name: Run API E2E suite
        run: |
          chmod +x scripts/e2e-test.sh
          BASE_URL=http://localhost ADMIN_PASSWORD=ci-admin-password INGEST_API_KEY=ci-ingest-key ./scripts/e2e-test.sh

      - name: Show stack logs on failure
        if: failure()
        run: docker compose logs --tail=100

      - name: Tear down
        if: always()
        run: docker compose down -v
        env:
          ADMIN_PASSWORD: ci-admin-password